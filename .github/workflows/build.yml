name: Build four loader artifacts
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - minecraft: '26.2'
            java: '25'
          - minecraft: '1.21.1'
            java: '21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run rule checks
        working-directory: versions/${{ matrix.minecraft }}
        run: bash gradlew build --no-daemon
      - name: Verify distributable JARs with Kotlin tools
        run: bash versions/${{ matrix.minecraft }}/gradlew -p tools verifyArtifacts -PminecraftVersion=${{ matrix.minecraft }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Luna-Reforged-${{ matrix.minecraft }}
          path: build/release/${{ matrix.minecraft }}/*.jar
